# CNB 流水线配置
# 参考 h1s97x/action-gh-social-graph 的流水线设计进行优化：
#   0. 双向同步总览（重点）：
#      - CNB → GitHub：本流水线 push 到 main 时自动同步（见下方第 1 条）
#      - GitHub → CNB：由 .github/workflows/sync-cnb.yml 兜底反向同步（直接改 GitHub 再回灌 CNB），
#        与下方构成双向闭环，排除 .cnb*/.github/ 避免同步环死循环。
#   1. Git Sync：每次 push 到 main 后，使用官方 tencentcom/git-sync 插件自动同步到 GitHub
#      （h1s97x/sdutex），sync_mode: rebase（Rebase 模式），
#      保留 GitHub 仓库特有平台文件（如 .github/workflows/*.yml），避免无条件 force 覆盖远端提交。
#      敏感信息（GITHUB_USERNAME / GITHUB_TOKEN）存放在密钥仓库 secret-env，通过 imports 引用。
#   2. 手动触发（Web Trigger）：从 GitHub 拉取最新提交到 CNB（GitHub → CNB），
#      使用 git-sync 插件 sync_mode: pull，按钮见 .cnb/web_trigger.yml。
#   3. PR 自动分配处理人 / 审查人：创建后自动将处理人、审查人设置为仓库维护者。
#   4. Issue 自动分配处理人：Issue 创建后自动分配给仓库维护者。
#   5. Tag 发布：v* tag 触发时构建 CTAN 包并创建 Release。

main:
  # push 到 main 后自动同步到 GitHub
  push:
    - name: sync-to-github
      imports:
        - https://cnb.cool/h1s97x/secret-env/-/blob/main/env.yml
      stages:
        - name: sync to github
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/h1s97x/sdutex.git
            auth_type: https
            username: ${GITHUB_USERNAME}
            password: ${GITHUB_TOKEN}
            branch: main
            push_tags: true
            # Rebase 模式：保留 GitHub 仓库特有平台文件，同时避免无条件 force 覆盖远端新提交。
            sync_mode: rebase

  # PR 创建后自动分配处理人和审查人（make test 编译门禁在 GitHub Actions 流水线中执行，
  # 见 .github/workflows/test.yml，CNB 侧不重复做 PR 门禁）
  # 使用 pull_request 事件：会 checkout 预合并后的代码（含 PR 分支修改），
  # 而不是 pull_request.target（只 checkout 目标分支 main 的代码）。
  pull_request:
    - name: auto-assign-pr-owner
      env:
        PR_REVIEWER: h1s97x
      stages:
        - name: assign pr to owner
          type: git:reviewer
          options:
            type: add-assignee
            reviewers: ${PR_REVIEWER}
        - name: add pr reviewer
          type: git:reviewer
          options:
            type: add-reviewer-from-repo-members

# 兜底分支：web_trigger / issue.* / tag_push 等事件
$:
  # 手动触发验证：l3build ctan 构建 CTAN 发布包（发布前置验证）
  api_trigger:
    - name: verify-l3build-ctan
      docker:
        image: texlive/texlive:latest
      stages:
        - name: run l3build ctan
          script: |
            set -e
            l3build ctan
            ls -la sdutex-ctan.zip

  # 手动触发：从 GitHub 拉取（GitHub → CNB）
  # 使用官方 tencentcom/git-sync 插件 + sync_mode: pull，按钮见 .cnb/web_trigger.yml
  web_trigger_pull_from_github:
    - name: web-trigger-pull-from-github
      imports:
        - https://cnb.cool/h1s97x/secret-env/-/blob/main/env.yml
      stages:
        - name: pull from github
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/h1s97x/sdutex.git
            auth_type: https
            username: ${GITHUB_USERNAME}
            password: ${GITHUB_TOKEN}
            sync_mode: pull

  # Issue 创建后自动分配处理人
  # 使用 cnbcool/cnb-cli 插件（CNB OpenAPI 命令行工具），流水线自动注入 CNB_TOKEN
  issue.open:
    - name: auto-assign-issue-owner
      env:
        ISSUE_ASSIGNEE: h1s97x
      stages:
        - name: assign issue to owner
          image: cnbcool/cnb-cli
          script: |
            set -e
            cnb issues add-assignees --assignees $ISSUE_ASSIGNEE

  # Tag 发布：构建 CTAN 发布包 + 编译使用手册 PDF + 创建 Release（v* tag 触发）
  tag_push:
    - name: release
      docker:
        image: texlive/texlive:latest
      stages:
        - name: build ctan
          script: make ctan
        - name: build manual
          script: make manual
        - name: create release
          type: git:release
          options:
            descriptionFromFile: CHANGELOG.md
        - name: upload release assets
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - "./sdutex-ctan.zip"
              - "./build/sduthesis.pdf"
              - "./LICENSE"
              - "./README.md"
