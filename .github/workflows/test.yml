name: Test
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'modules/**'
      - 'figures/**'
      - 'Makefile'
      - 'build.lua'
      - '.github/tl_packages'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'modules/**'
      - 'figures/**'
      - 'Makefile'
      - 'build.lua'
      - '.github/tl_packages'
      - '.github/workflows/test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 安装 TeX Live：与 sduthesis 仓库保持一致，使用 zauguin/install-texlive@v4。
      # 它按 .github/tl_packages 清单安装，且默认自动缓存 ~/texlive，跨 workflow 复用。
      - name: Install TeX Live
        uses: zauguin/install-texlive@v4
        with:
          package_file: .github/tl_packages

      # 关键：把 TeX 树字体软链到用户字体目录，让 XeLaTeX 按字体名能找到 Fandol 等中文字体。
      # 否则会报 `The font "FandolSong" cannot be found`（issue #35 反复失败的根因之一）。
      # 该做法与 sduthesis 的 build.yml / quality.yml 完全一致。
      - name: Link fonts for XeTeX
        run: |
          mkdir -p ~/.fonts
          ln -s $(kpsewhich -var-value=TEXMFDIST)/fonts/ ~/.fonts/texmf-dist-fonts

      - name: Run tests
        # 运行 l3build 回归测试套件（.tex/.tlg，XeTeX 引擎），
        # 对齐 sduthesis 的 CI 设计，由 l3build 统一负责解包、TDS 布局与测试编译。
        run: make test

      - name: Upload test diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diffs
          path: build/test*/*.diff
          if-no-files-found: warn
