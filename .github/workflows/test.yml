name: Test
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'Makefile'
      - 'build.lua'
      - '.github/tl_packages'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'Makefile'
      - 'build.lua'
      - '.github/tl_packages'
      - '.github/workflows/test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live
        uses: TeX-Live/setup-texlive-action@v4
        with:
          package-file: .github/tl_packages

      - name: Run tests
        run: make test

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: build/test/*.log
          if-no-files-found: warn
