name: Test
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'modules/**'
      - 'figures/**'
      - 'Makefile'
      - 'build.lua'
      - '.github/tl_packages'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'modules/**'
      - 'figures/**'
      - 'Makefile'
      - 'build.lua'
      - '.github/tl_packages'
      - '.github/workflows/test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live
        uses: TeX-Live/setup-texlive-action@v4
        with:
          package-file: .github/tl_packages

      - name: Run tests
        # 运行 l3build 回归测试套件（.tex/.tlg，xetex/luatex 双引擎），
        # 对齐 sduthesis 的 CI 设计，由 l3build 统一负责解包、TDS 布局与测试编译。
        run: make test

      - name: Upload test diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diffs
          path: build/test*/*.diff
          if-no-files-found: warn
